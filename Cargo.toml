[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# vendor/craft-update is a path dependency with its own manifest (vendor/craft-update/README.filmagic.md).
exclude = ["vendor/craft-update"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.20.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/vansyson1308/editfilm"

[workspace.dependencies]
# internal
filmagic-time = { path = "crates/time" }
filmagic-geom = { path = "crates/geom" }
filmagic-color = { path = "crates/color" }
filmagic-bitstream = { path = "crates/bitstream" }
filmagic-isobmff = { path = "crates/isobmff" }
filmagic-avi = { path = "crates/avi" }
filmagic-matroska = { path = "crates/matroska" }
filmagic-mxf = { path = "crates/mxf" }
filmagic-cfb = { path = "crates/cfb" }
filmagic-mpegts = { path = "crates/mpegts" }
filmagic-mpeg2v = { path = "crates/mpeg2v" }
filmagic-ac3 = { path = "crates/ac3" }
filmagic-mpa = { path = "crates/mpa" }
filmagic-ogg = { path = "crates/ogg" }
filmagic-h264 = { path = "crates/h264" }
filmagic-hevc = { path = "crates/hevc" }
filmagic-vp8 = { path = "crates/vp8" }
filmagic-vp9 = { path = "crates/vp9" }
filmagic-prores = { path = "crates/prores" }
filmagic-dnx = { path = "crates/dnx" }
filmagic-apv = { path = "crates/apv" }
filmagic-dng = { path = "crates/dng" }
filmagic-av1 = { path = "crates/av1" }
filmagic-aac = { path = "crates/aac" }
filmagic-mp3enc = { path = "crates/mp3enc" }
filmagic-flac = { path = "crates/flac" }
filmagic-opus = { path = "crates/opus" }
filmagic-h264enc = { path = "crates/h264enc" }
filmagic-audio-dsp = { path = "crates/audio-dsp" }
filmagic-frame = { path = "crates/frame" }
filmagic-media = { path = "crates/media" }
filmagic-codecs = { path = "crates/codecs" }
filmagic-project = { path = "crates/project" }
filmagic-edit = { path = "crates/edit" }
filmagic-interchange = { path = "crates/interchange" }
filmagic-text = { path = "crates/text" }
filmagic-captions = { path = "crates/captions" }
filmagic-speech = { path = "crates/speech" }
filmagic-tts = { path = "crates/tts" }
filmagic-tts-text = { path = "crates/tts-text" }
filmagic-render = { path = "crates/render" }
filmagic-gpu = { path = "crates/gpu" }
filmagic-scopes = { path = "crates/scopes" }
filmagic-export = { path = "crates/export" }
filmagic-format = { path = "crates/format" }
filmagic-engine = { path = "crates/engine" }
filmagic-ui-egui = { path = "crates/ui-egui" }
filmagic-automation = { path = "crates/automation" }
filmagic-platform = { path = "crates/platform" }
filmagic-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2.5.8"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
craft-media = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d", default-features = false }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d", features = ["serde", "native-windows"] }
# egui 0.37: bundled fonts are opt-in, and the monochrome symbol/emoji faces moved to their own
# feature. Filmagic paints ✔ ✓ ✖ ⚡ ⚠ ⚙ ♪ ☑ in panel chrome, so both features are part of the
# production font policy (system_fonts stays off).
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
# Resizable table columns (About ▸ Contributors / Models); no image loaders.
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# craft-update: app-specific pretend versions apply to startup and manual checks.
# Vendored from storytold/craft-libs@1b34eba (vendor/craft-update/README.filmagic.md).
craft-update = { path = "vendor/craft-update", version = "=0.1.0", features = ["egui"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.filmagic-h264]
opt-level = 3

[profile.dev.package.filmagic-h264enc]
opt-level = 3

[profile.dev.package.filmagic-hevc]
opt-level = 3

[profile.dev.package.filmagic-prores]
opt-level = 3

[profile.dev.package.filmagic-dnx]
opt-level = 3

[profile.dev.package.filmagic-apv]
opt-level = 3

[profile.dev.package.filmagic-dng]
opt-level = 3

[profile.dev.package.filmagic-av1]
opt-level = 3

[profile.dev.package.filmagic-aac]
opt-level = 3

[profile.dev.package.filmagic-mp3enc]
opt-level = 3

[profile.dev.package.filmagic-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.filmagic-audio-dsp]
opt-level = 3

[profile.dev.package.filmagic-mxf]
opt-level = 3

[profile.dev.package.filmagic-opus]
opt-level = 3

[profile.dev.package.filmagic-vp8]
opt-level = 3

[profile.dev.package.filmagic-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Keep the complete egui family and native event bridge on reviewed fork commits.
