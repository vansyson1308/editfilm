<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- Filmagic app icon: a strip of film crossing a violet tile, a gold sparkle bursting from its
     middle frame. Original work drawn by hand for Filmagic; see README.md. -->
<defs>
  <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
</defs>
<g clip-path="url(#tile)">
  <!-- Field: Filmagic violet, full bleed. -->
  <rect width="512" height="512" fill="#8b5cf6"/>
  <!-- Film strip, tilted 12 degrees: ink base, two rows of sprocket holes, three frames. -->
  <g transform="rotate(-12 256 256)">
    <rect x="-160" y="146" width="832" height="220" fill="#0b0b0c"/>
    <g fill="#8b5cf6">
      <rect x="-96" y="161" width="30" height="28" rx="7"/>
      <rect x="-40" y="161" width="30" height="28" rx="7"/>
      <rect x="16" y="161" width="30" height="28" rx="7"/>
      <rect x="72" y="161" width="30" height="28" rx="7"/>
      <rect x="128" y="161" width="30" height="28" rx="7"/>
      <rect x="184" y="161" width="30" height="28" rx="7"/>
      <rect x="240" y="161" width="30" height="28" rx="7"/>
      <rect x="296" y="161" width="30" height="28" rx="7"/>
      <rect x="352" y="161" width="30" height="28" rx="7"/>
      <rect x="408" y="161" width="30" height="28" rx="7"/>
      <rect x="464" y="161" width="30" height="28" rx="7"/>
      <rect x="520" y="161" width="30" height="28" rx="7"/>
      <rect x="-96" y="323" width="30" height="28" rx="7"/>
      <rect x="-40" y="323" width="30" height="28" rx="7"/>
      <rect x="16" y="323" width="30" height="28" rx="7"/>
      <rect x="72" y="323" width="30" height="28" rx="7"/>
      <rect x="128" y="323" width="30" height="28" rx="7"/>
      <rect x="184" y="323" width="30" height="28" rx="7"/>
      <rect x="240" y="323" width="30" height="28" rx="7"/>
      <rect x="296" y="323" width="30" height="28" rx="7"/>
      <rect x="352" y="323" width="30" height="28" rx="7"/>
      <rect x="408" y="323" width="30" height="28" rx="7"/>
      <rect x="464" y="323" width="30" height="28" rx="7"/>
      <rect x="520" y="323" width="30" height="28" rx="7"/>
    </g>
    <rect x="15" y="203" width="150" height="106" rx="8" fill="#3b2672"/>
    <rect x="181" y="203" width="150" height="106" rx="8" fill="#4a2f8f"/>
    <rect x="347" y="203" width="150" height="106" rx="8" fill="#3b2672"/>
  </g>
  <!-- Sparkles: four-pointed stars, each tip joined to the next by a curve pulled to the centre. -->
  <path d="M256 118Q275 237 394 256Q275 275 256 394Q237 275 118 256Q237 237 256 118Z" fill="#fff3d6" stroke="#ffcf70" stroke-width="9" stroke-linejoin="round"/>
  <path d="M394 60Q401 97 438 104Q401 111 394 148Q387 111 350 104Q387 97 394 60Z" fill="#ffcf70"/>
  <path d="M112 378Q116 400 138 404Q116 408 112 430Q108 408 86 404Q108 400 112 378Z" fill="#fff3d6"/>
</g>
</svg>
