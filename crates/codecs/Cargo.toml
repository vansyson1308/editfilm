[package]
name = "filmagic-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmagic-time = { workspace = true }
filmagic-color = { workspace = true }
filmagic-frame = { workspace = true }
filmagic-media = { workspace = true }
filmagic-avi = { workspace = true }
filmagic-isobmff = { workspace = true }
filmagic-matroska = { workspace = true }
filmagic-mxf = { workspace = true }
filmagic-mpegts = { workspace = true }
filmagic-mpeg2v = { workspace = true }
filmagic-ac3 = { workspace = true }
filmagic-mpa = { workspace = true }
filmagic-ogg = { workspace = true }
filmagic-bitstream = { workspace = true }
filmagic-h264 = { workspace = true }
filmagic-hevc = { workspace = true }
filmagic-vp8 = { workspace = true }
filmagic-vp9 = { workspace = true }
filmagic-prores = { workspace = true }
filmagic-dnx = { workspace = true }
filmagic-av1 = { workspace = true }
filmagic-apv = { workspace = true }
filmagic-aac = { workspace = true }
filmagic-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
filmagic-testkit = { workspace = true }
serde_json = { workspace = true }
