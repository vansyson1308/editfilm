[package]
name = "filmagic-automation"
description = "MCP server (rmcp) over the Filmagic engine, plus a bridge to the running app's control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmagic-engine = { workspace = true }
filmagic-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time", "fs"] }
base64 = "0.23"
schemars = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
# The nonce of the control server's hello (#17; MIT OR Apache-2.0, in the lock file).
getrandom = "0.3"
