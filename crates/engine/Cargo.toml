[package]
name = "filmagic-engine"
description = "Filmagic engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["filmagic-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["filmagic-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["filmagic-tts/kokoro", "speech-download"]

[dependencies]
filmagic-time = { workspace = true }
filmagic-geom = { workspace = true }
filmagic-color = { workspace = true }
filmagic-frame = { workspace = true }
filmagic-media = { workspace = true }
filmagic-codecs = { workspace = true }
filmagic-project = { workspace = true }
filmagic-edit = { workspace = true }
filmagic-render = { workspace = true }
filmagic-scopes = { workspace = true }
filmagic-text = { workspace = true }
filmagic-audio-dsp = { workspace = true }
filmagic-export = { workspace = true }
filmagic-mxf = { workspace = true }
filmagic-format = { workspace = true }
filmagic-interchange = { workspace = true }
filmagic-captions = { workspace = true }
filmagic-speech = { workspace = true }
filmagic-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
roxmltree = { workspace = true }
chrono = { workspace = true }
craft-docpath = { workspace = true }
web-time = "1"

[dev-dependencies]
filmagic-testkit = { workspace = true }
filmagic-audio-dsp = { workspace = true, features = ["test-util"] }
filmagic-dng = { workspace = true, features = ["writer"] }
filmagic-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
