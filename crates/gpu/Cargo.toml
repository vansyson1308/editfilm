[package]
name = "filmagic-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmagic-color = { workspace = true }
filmagic-frame = { workspace = true }
filmagic-geom = { workspace = true }
filmagic-project = { workspace = true }
filmagic-render = { workspace = true }
filmagic-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "1"
rayon = { workspace = true }

[dev-dependencies]
pollster = "1"
filmagic-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
filmagic-media = { workspace = true }
filmagic-time = { workspace = true }
