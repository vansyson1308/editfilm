[package]
name = "filmagic-tts"
description = "Filmagic text to speech: the Voice trait, the voice catalogue, script parsing (pause markers), the built-in formant voice, (feature kokoro) Kokoro-82M neural voices on candle, and the optional external VieNeu-TTS engine (Vietnamese)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Kokoro-82M neural voices on the CPU via candle (pure Rust). Off by default and in wasm builds.
kokoro = ["dep:candle-core", "dep:candle-nn", "dep:zip", "dep:sha2", "dep:filmagic-tts-text"]

[dependencies]
filmagic-tts-text = { workspace = true, optional = true }
filmagic-audio-dsp = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
candle-core = { version = "0.9", default-features = false, optional = true }
candle-nn = { version = "0.9", default-features = false, optional = true }
zip = { version = "7", default-features = false, optional = true }
serde_json = { workspace = true }
unicode-normalization = "0.1"
sha2 = { version = "0.10", optional = true }

[[example]]
name = "kokoro_say"
required-features = ["kokoro"]

[[example]]
name = "narrate"
required-features = ["kokoro"]

[dev-dependencies]
tempfile = "3.27"
